<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- Network allowlist: same origin + model downloads. Also stops the usage metrics
         @mediapipe/tasks-vision would POST to odml.pa.googleapis.com (it has no opt-out). -->
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://storage.googleapis.com" />
    <title>webcam-body-fx</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111111'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23f5c16c' stroke-width='3'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main id="stage">
      <div id="view"></div>
      <video id="video" playsinline muted autoplay></video>
      <div id="targets"></div>
      <div class="bar" id="info-bar">
        <button type="button" id="info-toggle" class="info-toggle" aria-controls="info-bar" aria-pressed="false" aria-label="Hide info" title="Hide info">ⓘ</button>
        <button type="button" id="start">Start</button>
        <button type="button" id="reset">Reset</button>
        <span class="hint">Pinch thumb + index once = next effect; quick double-pinch = normal camera (or click an effect zone / Tab then Enter; bottom-right Cancel restores the view) (press H or ⓘ to hide/show info)</span>
        <span class="status" id="status" role="status"></span>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
